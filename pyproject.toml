[project]
name = "quiver"
version = "0.1.0"
description = "Universal ADBC query tool - explore Arrow database connectivity across multiple backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julien Pequegnot" }]
keywords = ["arrow", "adbc", "flightsql", "database", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyarrow>=14.0.0",
    "adbc-driver-manager>=0.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.9.0"]
sqlite = ["adbc-driver-sqlite>=0.8.0"]
flightsql = ["adbc-driver-flightsql>=0.8.0"]
influxdb = ["adbc-driver-flightsql>=0.8.0"]
finance = ["yfinance>=0.2.0"]
all = [
    "duckdb>=0.9.0",
    "adbc-driver-sqlite>=0.8.0",
    "adbc-driver-flightsql>=0.8.0",
    "yfinance>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
quiver = "quiver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
